<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apple CarPlay</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #v{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;
    touch-action:none;cursor:pointer;display:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;
    touch-action:none;cursor:pointer;display:none}
  #waiting{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#888;font-family:-apple-system,sans-serif;font-size:15px;text-align:center;
    padding:24px;line-height:1.6}
  #hint{position:fixed;left:0;right:0;bottom:0;text-align:center;color:rgba(255,255,255,.35);
    font-family:-apple-system,sans-serif;font-size:12px;padding:10px;pointer-events:none}
  .tbtn{position:fixed;z-index:10;background:rgba(0,0,0,.45);
    color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;
    font-size:16px;padding:6px 10px;cursor:pointer}
  #mutebtn{top:10px;right:10px}
  #focusbtn{top:10px;right:64px}
  #panelbtn{top:10px;right:118px}
  #hud{position:fixed;top:10px;left:10px;z-index:10;background:rgba(0,0,0,.55);
    color:#0f0;border:1px solid rgba(0,255,0,.3);border-radius:6px;
    font-family:monospace;font-size:11px;padding:6px 8px;line-height:1.5;
    display:none;pointer-events:none;white-space:pre}
  /* Focus mode: hide all chrome */
  body.focus #hud,body.focus #hint,body.focus .tbtn,body.focus #panel{display:none!important}
  /* Settings panel */
  #panel{position:fixed;top:52px;right:10px;z-index:20;background:rgba(20,20,20,.92);
    color:#eee;border:1px solid rgba(255,255,255,.2);border-radius:10px;
    font-family:-apple-system,sans-serif;font-size:13px;padding:12px;width:250px;
    display:none;max-height:80vh;overflow-y:auto}
  #panel h3{margin:0 0 8px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:6px}
  #panel .row{margin:8px 0;display:flex;align-items:center;justify-content:space-between}
  #panel label{flex:0 0 90px;color:#aaa}
  #panel select,#panel input[type=range]{flex:1;background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:4px}
  #panel input[type=range]{padding:0}
  #panel .val{flex:0 0 36px;text-align:right;color:#0f0;font-family:monospace;font-size:11px}
  #panel button{background:#2a6fd6;color:#fff;border:none;border-radius:6px;padding:6px 12px;
    font-size:13px;cursor:pointer;margin:4px 2px}
  #panel button:active{background:#1a5fc6}
  #micbtn{background:#c62a2a}
  #micbtn.on{background:#2ad66f}
</style>
</head>
<body>
<div id="waiting">正在等待 CarPlay 视频…<br>请确认 Mac 上的 MacPlay 已连接 iPhone</div>
<img id="v" alt="" draggable="false">
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">触摸屏幕操作 CarPlay</div>
<button id="mutebtn" class="tbtn" title="静音/取消静音">🔊</button>
<button id="focusbtn" class="tbtn" title="专注模式">⛶</button>
<button id="panelbtn" class="tbtn" title="设置">⚙️</button>

<div id="panel">
  <h3>显示设置</h3>
  <div class="row"><label>分辨率</label>
    <select id="res">
      <option value="800x480">800×480</option>
      <option value="1280x720" selected>1280×720</option>
      <option value="1920x720">1920×720</option>
      <option value="1920x1080">1920×1080</option>
      <option value="2560x1440">2560×1440</option>
    </select>
  </div>
  <div class="row"><label>帧率</label>
    <select id="fps"><option value="30">30fps</option><option value="60" selected>60fps</option></select>
  </div>
  <div class="row"><label>编码</label>
    <select id="codec"><option value="h264" selected>H.264</option><option value="hevc">H.265/HEVC</option></select>
  </div>
  <div class="row"><label>UI 缩放</label>
    <select id="uiscale"><option value="75">小 75%</option><option value="85">较小 85%</option>
    <option value="100" selected>默认 100%</option><option value="115">大 115%</option></select>
  </div>
  <div class="row"><button id="matchwin" style="flex:1">匹配本窗口像素</button></div>
  <div class="row"><button id="applydisplay" style="flex:1">应用显示设置</button></div>

  <h3 style="margin-top:12px">音频混音</h3>
  <div class="row"><label>总音量</label><input type="range" id="vol-master" min="0" max="100" value="100"><span class="val" id="vol-master-v">100</span></div>
  <div class="row"><label>媒体</label><input type="range" id="vol-media" min="0" max="100" value="100"><span class="val" id="vol-media-v">100</span></div>
  <div class="row"><label>导航</label><input type="range" id="vol-nav" min="0" max="100" value="100"><span class="val" id="vol-nav-v">100</span></div>
  <div class="row"><label>通话/Siri</label><input type="range" id="vol-call" min="0" max="100" value="100"><span class="val" id="vol-call-v">100</span></div>

  <h3 style="margin-top:12px">麦克风</h3>
  <div class="row"><button id="micbtn" style="flex:1">🎤 启用麦克风</button></div>
  <div class="row" style="font-size:11px;color:#888">Siri/通话时将浏览器麦克风送回 iPhone</div>

  <h3 style="margin-top:12px">安全边距</h3>
  <div class="row"><label>上</label><input type="range" id="margin-top" min="0" max="40" value="0"><span class="val" id="margin-top-v">0%</span></div>
  <div class="row"><label>下</label><input type="range" id="margin-bottom" min="0" max="40" value="0"><span class="val" id="margin-bottom-v">0%</span></div>
  <div class="row"><label>左</label><input type="range" id="margin-left" min="0" max="40" value="0"><span class="val" id="margin-left-v">0%</span></div>
  <div class="row"><label>右</label><input type="range" id="margin-right" min="0" max="40" value="0"><span class="val" id="margin-right-v">0%</span></div>
  <div class="row" style="font-size:11px;color:#888">避开刘海/系统栏遮挡，0-40%</div>
</div>

<script>
(function(){
  var img=document.getElementById('v'),
      waiting=document.getElementById('waiting'),
      hint=document.getElementById('hint'),
      mutebtn=document.getElementById('mutebtn'),
      focusbtn=document.getElementById('focusbtn'),
      panelbtn=document.getElementById('panelbtn'),
      panel=document.getElementById('panel'),
      ws=null, wsReady=false,
      active=new Map(),
      imgShown=false, muted=false;

  /* ============ video (WebCodecs H.264 passthrough) ============ */
  var useWebCodecs = window.isSecureContext && ('VideoDecoder' in window);
  // Fork (screen capture): if the server is in screencap mode, force MJPEG
  // even in a secure context (there's no H.264 stream to decode).
  var health=null;
  try {
    var healthXhr = new XMLHttpRequest();
    healthXhr.open('GET', '/health', false); // synchronous, runs once at load
    healthXhr.send();
    if (healthXhr.status === 200) {
      health = JSON.parse(healthXhr.responseText);
      if (health.mode === 'screencap') useWebCodecs = false;
    }
  } catch (e) { /* ignore, fall back to default */ }
  // Fork: preselect the streaming codec in the settings panel so "应用显示设置"
  // resends what's in use unless the user changes it.
  try {
    if (health && health.codec) {
      var codecSel=document.getElementById('codec');
      if (codecSel) codecSel.value = health.codec === 'h265' ? 'hevc' : 'h264';
    }
  } catch (e) {}
  var canvas=document.getElementById('c'), ctx2d=null;
  var h264ws=null, videoDecoder=null, decoderConfigured=false;
  var spsPps=null, frameCount=0, bytesCount=0, lastStatTime=Date.now();
  var hud=document.getElementById('hud');

  function updateHud(mode, extra){
    hud.style.display='block';
    var now=Date.now(), dt=(now-lastStatTime)/1000;
    var fps=dt>0?(frameCount/dt).toFixed(1):'0';
    var kbps=dt>0?((bytesCount*8/dt)/1000).toFixed(0):'0';
    hud.textContent=mode+'\n'+fps+' fps  '+kbps+' kbps'+(extra?'\n'+extra:'');
    if(dt>=1){ frameCount=0; bytesCount=0; lastStatTime=now; }
  }

  function parseNalUnits(data){
    var units=[], i=0, n=data.length;
    while(i<n-3){
      var scLen=0;
      if(data[i]===0&&data[i+1]===0){
        if(data[i+2]===1) scLen=3;
        else if(i+3<n&&data[i+2]===0&&data[i+3]===1) scLen=4;
      }
      if(!scLen){ i++; continue; }
      var start=i+scLen, j=start, found=false;
      while(j<n-3){
        if(data[j]===0&&data[j+1]===0&&
           (data[j+2]===1||(j+3<n&&data[j+2]===0&&data[j+3]===1))) { found=true; break; }
        j++;
      }
      // Fork: if no next start code found, the NAL runs to the end of data
      if(!found) j=n;
      if(j>start) units.push(data.subarray(start,j));
      i=j;
    }
    return units;
  }

  function buildAvcC(sps, pps){
    var len=7+2+sps.length+1+2+pps.length;
    var out=new Uint8Array(len), o=0;
    out[o++]=1; out[o++]=sps[1]; out[o++]=sps[2]; out[o++]=sps[3];
    out[o++]=0xFF; out[o++]=0xE1;
    out[o++]=(sps.length>>8)&0xFF; out[o++]=sps.length&0xFF;
    out.set(sps,o); o+=sps.length;
    out[o++]=1;
    out[o++]=(pps.length>>8)&0xFF; out[o++]=pps.length&0xFF;
    out.set(pps,o);
    return out;
  }

  function codecStringFromSps(sps){
    function hx(b){ return ('0'+b.toString(16)).slice(-2).toUpperCase(); }
    return 'avc1.'+hx(sps[1])+hx(sps[2])+hx(sps[3]);
  }

  // Fork: PlayPort-style HEVC codec probing.
  // Tries multiple codec strings from most specific to least specific and each
  // hardware preference (Chromium only exposes HEVC through platform decoders),
  // using VideoDecoder.isConfigSupported to find one that works.
  async function probeHevcCodec(hvcC){
    var candidates=[];
    if(hvcC.length>=13){
      var profileSpace=['','A','B','C'][(hvcC[1]>>6)&0x03]||'';
      var tier=((hvcC[1]&0x20)!==0)?'H':'L';
      var profileIdc=hvcC[1]&0x1F;
      var compat=((hvcC[2]<<24)|(hvcC[3]<<16)|(hvcC[4]<<8)|hvcC[5])>>>0;
      // Bit-reverse for WebCodecs (ISO/IEC 14496-15)
      var rev=0, v=compat;
      for(var i=0;i<32;i++){ rev=((rev<<1)|(v&1))>>>0; v>>>=1; }
      var levelIdc=hvcC[12];
      var base='hvc1.'+profileSpace+profileIdc+'.'+rev.toString(16)+'.'+tier+levelIdc;
      candidates.push(base);
    }
    // Fallbacks (PlayPort-style)
    candidates.push('hvc1.1.6.L120.B0');
    candidates.push('hvc1.1.6.L93.B0');
    for(var c of candidates){
      for(var a of ['prefer-hardware', null, 'prefer-software']){
        try{
          var cfg={codec:c, description:hvcC};
          if(a) cfg.hardwareAcceleration=a;
          var support=await VideoDecoder.isConfigSupported(cfg);
          if(support&&support.supported) return {codec:c, accel:a};
        }catch(e){}
      }
    }
    return null;
  }

  async function configureDecoder(cfg){
    // Fork: cfg={vps,sps,pps} for HEVC, {sps,pps} for H.264
    // PlayPort-style: probe HEVC, use raw config as description
    if(cfg.vps){
      var hvcC=buildHvcC(cfg.vps,cfg.sps,cfg.pps);
      var best=await probeHevcCodec(hvcC);
      if(!best){
        decoderConfigured=false;
        var w=document.getElementById('waiting');
        if(w&&!imgShown){
          w.innerHTML='此浏览器不支持 H.265 (HEVC) 硬件解码<br>'+
            '请改用支持 HEVC 的浏览器(Chrome/Edge 107+ 或 Safari 17+)<br>'+
            '或在 Mac 本机打开本页面';
        }
        return;
      }
      try{
        var dcfg={codec:best.codec, description:hvcC, optimizeForLatency:true};
        if(best.accel) dcfg.hardwareAcceleration=best.accel;
        videoDecoder.configure(dcfg);
        decoderConfigured=true; sawKeyAfterConfig=false; auBuf=[];
        // Fork: watchdog - request keyframe if no frames decoded in 2.5s
        armKeyframeWatchdog();
        if(wsReady) send({t:'keyframe'}); // WebCodecs needs a key chunk first
      }catch(e){ decoderConfigured=false; }
    }else{
      var codec=codecStringFromSps(cfg.sps);
      var desc=buildAvcC(cfg.sps,cfg.pps);
      try{
        videoDecoder.configure({ codec:codec, description:desc, optimizeForLatency:true });
        decoderConfigured=true; sawKeyAfterConfig=false; auBuf=[];
        armKeyframeWatchdog();
        if(wsReady) send({t:'keyframe'});
      }catch(e){ decoderConfigured=false; }
    }
  }

  // Fork: PlayPort-style keyframe watchdog.
  // If no frames decoded in 2.5s, request keyframe from iPhone.
  var keyframeWatchdog=null, framesDecodedSinceConfig=0;
  function armKeyframeWatchdog(){
    clearKeyframeWatchdog();
    framesDecodedSinceConfig=0;
    keyframeWatchdog=setTimeout(function(){
      if(framesDecodedSinceConfig===0 && decoderConfigured){
        // Request keyframe via WebSocket
        if(wsReady) send({t:'keyframe'});
        armKeyframeWatchdog(); // Re-arm
      }
    }, 2500);
  }
  function clearKeyframeWatchdog(){
    if(keyframeWatchdog){ clearTimeout(keyframeWatchdog); keyframeWatchdog=null; }
  }
  // Call this when a frame is successfully decoded
  function onFrameDecoded(){ framesDecodedSinceConfig++; }

  function buildHvcC(vps, sps, pps){
    // hvcC record assembled from the stream's parameter sets. The general
    // profile/tier/level is copied verbatim from the SPS (2-byte NAL header,
    // 1 byte vpsId/sublayers/nesting, then 12 bytes of general PTL) so the
    // record matches what the phone actually encodes.
    var vlen=vps.length, slen=sps.length, plen=pps.length;
    var len=23+3+2+vlen+3+2+slen+3+2+plen;
    var out=new Uint8Array(len), o=0;
    out[o++]=1; // configurationVersion
    if(sps.length>=15){
      out.set(sps.subarray(3,15),o); o+=12; // profile, compat, constraints, level
    }else{
      // general_profile_space(0)+tier(0)+profile_idc(1=Main)
      out[o++]=1; out[o++]=0x60; out[o++]=0; out[o++]=0; out[o++]=0;
      for(var i=0;i<6;i++) out[o++]=0; // constraint flags
      out[o++]=93; // level_idc
    }
    out[o++]=0xF0; out[o++]=0; // min_spatial_segmentation
    out[o++]=0xFC; // parallelismType
    out[o++]=0xFD; // chromaFormat = 1 (4:2:0)
    out[o++]=0xF8; // bitDepthLumaMinus8 = 0
    out[o++]=0xF8; // bitDepthChromaMinus8 = 0
    out[o++]=0; out[o++]=0; // avgFrameRate
    out[o++]=0x03; // constFramerate/numLayers/nested/lengthSize
    out[o++]=3; // numOfArrays
    // VPS array (type 32)
    out[o++]=0xA0; out[o++]=0; out[o++]=1;
    out[o++]=(vlen>>8)&0xFF; out[o++]=vlen&0xFF; out.set(vps,o); o+=vlen;
    // SPS array (type 33)
    out[o++]=0xA1; out[o++]=0; out[o++]=1;
    out[o++]=(slen>>8)&0xFF; out[o++]=slen&0xFF; out.set(sps,o); o+=slen;
    // PPS array (type 34)
    out[o++]=0xA2; out[o++]=0; out[o++]=1;
    out[o++]=(plen>>8)&0xFF; out[o++]=plen&0xFF; out.set(pps,o);
    return out;
  }

  /* Fork: access-unit assembly. WebCodecs wants one EncodedVideoChunk per
     picture (all slices plus leading SEI, length-prefixed); feeding one chunk
     per NAL never yields a frame. NALs buffer here until the next picture's
     first slice (or an AUD) closes the unit. */
  var auBuf=[], auHasKey=false, auPendingSince=0, sawKeyAfterConfig=false;
  function nalType(nal){
    if(videoCodec==='h265') return nal.length>=2?((nal[0]>>1)&0x3F):-1;
    return nal.length>=1?(nal[0]&0x1F):-1;
  }
  function isKeyType(t){
    // HEVC IRAP (IDR/BLA/CRA) = 16..23; H.264 IDR = 5
    return videoCodec==='h265' ? (t>=16&&t<=23) : t===5;
  }
  function isFirstSlice(nal,t){
    // slice payload opens with first_slice_segment_in_pic_flag (HEVC) /
    // first_mb_in_slice==0 (H.264), both encoded as a set high bit
    if(videoCodec==='h265') return t>=0&&t<32 && nal.length>=3 && (nal[2]&0x80)!==0;
    return t>=1&&t<=5 && nal.length>=2 && (nal[1]&0x80)!==0;
  }
  function sameBytes(a,b){
    if(a.length!==b.length) return false;
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }
  function cacheParam(kind,nal){
    spsPps=spsPps||{};
    if(spsPps[kind]&&sameBytes(spsPps[kind],nal)) return;
    spsPps[kind]=nal;
    if(decoderConfigured) decoderConfigured=false; // params changed: reconfigure
  }
  function flushAu(){
    if(!auBuf.length) return;
    var use=auBuf, key=auHasKey;
    auBuf=[]; auHasKey=false;
    if(!decoderConfigured||!videoDecoder||videoDecoder.state==='closed') return;
    if(!sawKeyAfterConfig&&!key) return; // first chunk after configure must be a key
    if(key) sawKeyAfterConfig=true;
    if(videoDecoder.decodeQueueSize>24&&!key){ return; } // falling behind: drop deltas
    var total=0,i;
    for(i=0;i<use.length;i++) total+=4+use[i].length;
    var chunk=new Uint8Array(total),o=0;
    for(i=0;i<use.length;i++){
      chunk[o]=(use[i].length>>>24)&0xFF; chunk[o+1]=(use[i].length>>>16)&0xFF;
      chunk[o+2]=(use[i].length>>>8)&0xFF; chunk[o+3]=use[i].length&0xFF;
      chunk.set(use[i],o+4); o+=4+use[i].length;
    }
    try{
      videoDecoder.decode(new EncodedVideoChunk({
        type:key?'key':'delta', timestamp:ts, data:chunk }));
      ts+=33333;
    }catch(e){}
  }
  function feedNal(nal){
    var t=nalType(nal);
    if(videoCodec==='h265'){
      if(t===32){ cacheParam('vps',nal); return; }
      if(t===33){ cacheParam('sps',nal); return; }
      if(t===34){ cacheParam('pps',nal); return; }
      if(t===35){ flushAu(); return; } // AUD delimits pictures
    }else{
      if(t===7){ cacheParam('sps',nal); return; }
      if(t===8){ cacheParam('pps',nal); return; }
      if(t===9){ flushAu(); return; } // AUD
    }
    if(t<0) return;
    if(isFirstSlice(nal,t)&&auBuf.length) flushAu();
    if(!auBuf.length){ auHasKey=false; auPendingSince=Date.now(); }
    if(isKeyType(t)) auHasKey=true;
    auBuf.push(nal);
  }

  var videoCodec='h264', ts=0; // codec set from server's first text message

  function makeDecoder(){
    videoDecoder=new VideoDecoder({
      output:function(frame){
        if(canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight){
          canvas.width=frame.displayWidth; canvas.height=frame.displayHeight;
        }
        ctx2d.drawImage(frame,0,0); frame.close();
        if(!imgShown){ imgShown=true; waiting.style.display='none'; }
        frameCount++;
        onFrameDecoded(); // Fork: PlayPort-style keyframe watchdog
      },
      error:function(e){
        // Fork: recreate the decoder; a fatal error closes it for good
        var w=document.getElementById('waiting');
        if(w&&!imgShown) w.innerHTML='解码器错误: '+(e&&e.message?e.message:e)+'<br>正在重建解码器…';
        decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
        try{ videoDecoder.close(); }catch(err){}
        setTimeout(function(){ makeDecoder(); }, 300);
      }
    });
  }

  function startWebCodecs(){
    canvas.style.display='block'; img.style.display='none';
    ctx2d=canvas.getContext('2d');
    decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
    makeDecoder();
    var proto=location.protocol==='https:'?'wss':'ws';
    h264ws=new WebSocket(proto+'://'+location.host+'/h264');
    h264ws.binaryType='arraybuffer';
    h264ws.onmessage=function(ev){
      // Fork: first message is JSON with codec info
      if(typeof ev.data==='string'){
        try{
          var msg=JSON.parse(ev.data);
          if(msg.codec&&msg.codec!==videoCodec){
            videoCodec=msg.codec;
            // a different stream needs a fresh decoder
            spsPps=null; decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
            try{ videoDecoder.close(); }catch(e){}
            makeDecoder();
          }
        }catch(e){}
        return;
      }
      var data=new Uint8Array(ev.data); bytesCount+=data.length;
      var units=parseNalUnits(data);
      for(var i=0;i<units.length;i++) feedNal(units[i]);
      // a stalled partial access unit is flushed by age
      if(auBuf.length&&Date.now()-auPendingSince>150) flushAu();
      var hasConfig = videoCodec==='h265' ?
        (spsPps&&spsPps.vps&&spsPps.sps&&spsPps.pps) :
        (spsPps&&spsPps.sps&&spsPps.pps);
      if(!decoderConfigured&&hasConfig){
        try { configureDecoder(spsPps); }
        catch(cfgErr){
          var we=document.getElementById('waiting');
          if(we) we.innerHTML='配置解码器失败: '+cfgErr.message;
        }
      }
      // Fork: debug - show received NAL stats on waiting overlay
      var w=document.getElementById('waiting');
      if(w&&!imgShown){
        var cfgStr = videoCodec==='h265' ?
          'VPS:'+(spsPps&&spsPps.vps?'✓':'✗')+' SPS:'+(spsPps&&spsPps.sps?'✓':'✗')+' PPS:'+(spsPps&&spsPps.pps?'✓':'✗') :
          'SPS:'+(spsPps&&spsPps.sps?'✓':'✗')+' PPS:'+(spsPps&&spsPps.pps?'✓':'✗');
        w.innerHTML='['+videoCodec+'] 收到 NAL: '+units.length+'个/包<br>'+
          cfgStr+
          '<br>解码器:'+(decoderConfigured?'已配置':'未配置')+
          '<br>已解码帧:'+frameCount;
      }
      updateHud('WebCodecs '+(videoCodec==='h265'?'H.265':'H.264'));
    };
    h264ws.onclose=function(){ setTimeout(startWebCodecs,2000); };
    h264ws.onerror=function(){ try{h264ws.close();}catch(e){} };
  }

  function startMjpeg(){
    img.style.display='block'; canvas.style.display='none';
    img.src='/mjpeg?'+Date.now();
    img.addEventListener('error',function(){
      imgShown=false; waiting.style.display='flex';
      setTimeout(function(){ img.src='/mjpeg?'+Date.now(); },2000);
    });
    img.addEventListener('load',function(){ frameCount++; });
    setInterval(function(){ updateHud('MJPEG'); },1000);
  }

  if (useWebCodecs) {
    startWebCodecs();
  } else {
    if (!window.isSecureContext) {
      var httpsPort = (typeof health !== 'undefined' && health && health.httpsPort) || 8443;
      var httpsUrl = 'https://' + location.hostname + ':' + httpsPort + location.pathname + location.search;
      var isZeroTranscode = typeof health !== 'undefined' && health && health.mode === 'zero-transcode';
      if (waiting) {
        waiting.innerHTML = '<div style="background:rgba(20,20,20,0.92);border:1px solid #3b82f6;border-radius:12px;padding:22px;max-width:440px;margin:auto;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.5);">' +
          '<div style="font-size:20px;font-weight:bold;color:#60a5fa;margin-bottom:10px;">🔒 需使用 HTTPS 访问</div>' +
          '<div style="font-size:14px;color:#eee;line-height:1.6;margin-bottom:16px;">' +
          '当前使用的是 <b>HTTP</b> 协议，浏览器安全规范禁止启用 <b>WebCodecs</b> 硬件解码。<br>' +
          (isZeroTranscode ? '<span style="color:#f59e0b;font-weight:bold;">当前处于零转码极速模式，必须使用 HTTPS。</span><br>' : '') +
          '</div>' +
          '<a href="' + httpsUrl + '" style="display:inline-block;background:#2563eb;color:#fff;padding:10px 24px;border-radius:8px;font-size:15px;text-decoration:none;font-weight:bold;cursor:pointer;">' +
          '👉 点击切换至 HTTPS 模式 (' + httpsPort + '端口)' +
          '</a>' +
          '<div style="font-size:12px;color:#aaa;margin-top:12px;line-height:1.4;">' +
          '首次访问如提示证书风险，点击“高级”或“详细信息”选择“继续访问”即可。' +
          '</div>' +
          '</div>';
      }
    }
    if (typeof health === 'undefined' || !health || health.mode !== 'zero-transcode') {
      startMjpeg();
    }
  }

  /* ============ audio mixer (per-stream GainNodes) ============ */
  var audioCtx=null, audioRunning=false;
  var masterGain=null, streamGains={}; // streamId -> GainNode
  var volLevels={master:1, media:1, nav:1, call:1};
  // stream id mapping: wheelplay protocol bit0=media; we classify:
  // stream 0/1 = media, 2 = nav, 3+ = call/siri (best effort)
  function streamKind(id){ return id<=1?'media':(id===2?'nav':'call'); }

  function ensureAudio(){
    if(!audioCtx){
      try{
        audioCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
        masterGain=audioCtx.createGain(); masterGain.connect(audioCtx.destination);
      }catch(e){ return; }
    }
    var p=audioCtx.resume();
    if(p&&p.then) p.then(function(){ audioRunning=audioCtx.state==='running'; });
    else audioRunning=audioCtx.state==='running';
  }
  function gainFor(stream){
    var g=streamGains[stream];
    if(!g){ g=audioCtx.createGain(); g.connect(masterGain); streamGains[stream]=g; }
    g.gain.value=volLevels[streamKind(stream)]||1;
    return g;
  }
  function applyVolumes(){
    if(masterGain) masterGain.gain.value=volLevels.master;
    Object.keys(streamGains).forEach(function(s){ gainFor(+s); });
  }
  ['master','media','nav','call'].forEach(function(k){
    var el=document.getElementById('vol-'+k), v=document.getElementById('vol-'+k+'-v');
    el.addEventListener('input',function(){
      volLevels[k]=el.value/100; v.textContent=el.value; applyVolumes();
      try{ localStorage.setItem('macplay-vol-'+k, el.value); }catch(e){}
    });
    try{ var sv=localStorage.getItem('macplay-vol-'+k); if(sv!==null){ el.value=sv; v.textContent=sv; volLevels[k]=sv/100; } }catch(e){}
  });

  function decodeAudioPacket(buffer){
    if(!(buffer instanceof ArrayBuffer)||buffer.byteLength<22) return null;
    var h=new DataView(buffer);
    if(h.getUint32(0,true)!==0x31415057) return null;
    var stream=h.getInt32(4,true), rate=h.getUint32(8,true), channels=h.getUint16(12,true);
    if(rate<8000||rate>96000||channels<1||channels>2||(buffer.byteLength-20)%(channels*2)) return null;
    return { stream:stream, rate:rate, channels:channels,
      media:!!(h.getUint16(14,true)&1), sequence:h.getUint32(16,true),
      pcm:new Int16Array(buffer,20) };
  }
  var audioStreams=new Map(), audioNodes=new Set();
  function playAudioPacket(buffer){
    if(muted) return;
    // retry the gesture unlock as packets arrive; drop audio while suspended
    // so nothing plays as a burst once unlocked
    if(!audioRunning){ ensureAudio(); return; }
    var frame=decodeAudioPacket(buffer); if(!frame) return;
    var now=audioCtx.currentTime;
    var delay=frame.media?0.3:0.06, maxAhead=frame.media?delay+1:0.25;
    var next=audioStreams.get(frame.stream);
    if(next===undefined) next=now+delay;
    if(next<now){
      audioNodes.forEach(function(n){ if(n._stream===frame.stream){ try{n.stop();}catch(e){} } });
      next=now+delay;
    }
    if(next-now>maxAhead||audioNodes.size>=256) return;
    var count=frame.pcm.length/frame.channels;
    var ab=audioCtx.createBuffer(frame.channels,count,frame.rate);
    for(var ch=0;ch<frame.channels;ch++){
      var out=ab.getChannelData(ch);
      for(var i=0;i<count;i++) out[i]=frame.pcm[i*frame.channels+ch]/32768;
    }
    var node=audioCtx.createBufferSource();
    node.buffer=ab; node._stream=frame.stream;
    node.connect(gainFor(frame.stream)); audioNodes.add(node);
    node.onended=function(){ audioNodes.delete(node); node.disconnect(); };
    node.start(next);
    audioStreams.set(frame.stream,next+count/frame.rate);
  }
  mutebtn.addEventListener('click',function(e){
    e.stopPropagation(); muted=!muted; mutebtn.textContent=muted?'🔇':'🔊';
  });
  document.addEventListener('pointerdown',ensureAudio,{capture:true});

  /* ============ microphone uplink (browser mic -> iPhone) ============ */
  var micStream=null, micProc=null, micOn=false;
  var micbtn=document.getElementById('micbtn');
  micbtn.addEventListener('click',function(e){
    e.stopPropagation();
    if(micOn){ stopMic(); } else { startMic(); }
  });
  function startMic(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert('浏览器不支持麦克风'); return; }
    ensureAudio();
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:16000}})
    .then(function(stream){
      micStream=stream;
      var src=audioCtx.createMediaStreamSource(stream);
      micProc=audioCtx.createScriptProcessor(4096,1,1);
      micProc.onaudioprocess=function(ev){
        if(!micOn||!wsReady) return;
        var inp=ev.inputBuffer.getChannelData(0);
        var pcm=new Int16Array(inp.length);
        for(var i=0;i<inp.length;i++) pcm[i]=Math.max(-32768,Math.min(32767,Math.round(inp[i]*32768)));
        // wheelplay mic frame: magic + stream(-1=mic) + rate + ch + flags + seq + pcm
        var hdr=new DataView(new ArrayBuffer(20));
        hdr.setUint32(0,0x31415057,true); hdr.setInt32(4,-1,true);
        hdr.setUint32(8,16000,true); hdr.setUint16(12,1,true);
        hdr.setUint16(14,0,true); hdr.setUint32(16,0,true);
        var out=new Uint8Array(20+pcm.length*2);
        out.set(new Uint8Array(hdr.buffer),0); out.set(new Uint8Array(pcm.buffer),20);
        ws.send(out.buffer);
      };
      src.connect(micProc); micProc.connect(audioCtx.destination);
      micOn=true; micbtn.textContent='🎤 麦克风开'; micbtn.classList.add('on');
    }).catch(function(){ alert('麦克风权限被拒绝'); });
  }
  function stopMic(){
    micOn=false; micbtn.textContent='🎤 启用麦克风'; micbtn.classList.remove('on');
    if(micProc){ try{micProc.disconnect();}catch(e){} micProc=null; }
    if(micStream){ micStream.getTracks().forEach(function(t){t.stop();}); micStream=null; }
  }

  /* ============ websocket ============ */
  function send(obj){ if(wsReady) ws.send(JSON.stringify(obj)); }
  function connect(){
    var proto=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(proto+'://'+location.host+'/touch');
    ws.binaryType='arraybuffer';
    ws.onopen=function(){ wsReady=true; };
    ws.onclose=function(){ wsReady=false; setTimeout(connect,2000); };
    ws.onerror=function(){ try{ws.close();}catch(e){} };
    ws.onmessage=function(ev){
      if(typeof ev.data!=='string') playAudioPacket(ev.data);
    };
  }
  connect();
  setInterval(function(){ send({t:'ping'}); },20000);

  /* ============ touch ============ */
  function mapPoint(clientX,clientY,rect,width,height,clamp){
    if(width<=0||height<=0||rect.width<=0||rect.height<=0) return null;
    var scale=Math.min(rect.width/width,rect.height/height);
    var w=width*scale, h=height*scale;
    var x=(clientX-rect.left-(rect.width-w)/2)/w;
    var y=(clientY-rect.top-(rect.height-h)/2)/h;
    if(!clamp&&(x<0||x>1||y<0||y>1)) return null;
    return {x:Math.max(0,Math.min(1,x)), y:Math.max(0,Math.min(1,y))};
  }
  function videoSize(){
    var el=useWebCodecs?canvas:img;
    var w=(useWebCodecs?canvas.width:img.naturalWidth)||960;
    var h=(useWebCodecs?canvas.height:img.naturalHeight)||Math.round(960*9/16);
    return {w:w,h:h,el:el};
  }
  function push(){
    var touches=[]; active.forEach(function(c){ touches.push(c); });
    send({t:'touch',touches:touches});
  }
  function slot(pid){ return (pid%2+2)%2; }
  function onPointerDown(e){
    e.preventDefault();
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
    var s=videoSize(), p=mapPoint(e.clientX,e.clientY,s.el.getBoundingClientRect(),s.w,s.h,false);
    if(!p) return;
    active.set(e.pointerId,{x:p.x,y:p.y,down:true,id:slot(e.pointerId)});
    push();
  }
  img.addEventListener('pointerdown',onPointerDown);
  canvas.addEventListener('pointerdown',onPointerDown);
  var movePending=false;
  function onPointerMove(e){
    var c=active.get(e.pointerId); if(!c) return;
    e.preventDefault();
    var s=videoSize(), p=mapPoint(e.clientX,e.clientY,s.el.getBoundingClientRect(),s.w,s.h,true);
    if(!p) return;
    c.x=p.x; c.y=p.y;
    if(!movePending){ movePending=true; requestAnimationFrame(function(){ movePending=false; push(); }); }
  }
  img.addEventListener('pointermove',onPointerMove);
  canvas.addEventListener('pointermove',onPointerMove);
  function release(e){
    var c=active.get(e.pointerId); if(!c) return;
    active.delete(e.pointerId);
    send({t:'touch',touches:[{x:c.x,y:c.y,down:false,id:c.id}]}); push();
  }
  function releaseAll(){
    if(!active.size) return;
    var ups=[]; active.forEach(function(c){ ups.push({x:c.x,y:c.y,down:false,id:c.id}); });
    active.clear(); send({t:'touch',touches:ups});
  }
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
    img.addEventListener(ev,release); canvas.addEventListener(ev,release);
  });
  ['contextmenu'].forEach(function(ev){
    img.addEventListener(ev,function(e){e.preventDefault();});
    canvas.addEventListener(ev,function(e){e.preventDefault();});
  });
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) releaseAll(); });
  window.addEventListener('pagehide',releaseAll);
  img.addEventListener('pointerdown',function(){ hint.style.display='none'; },{once:true});
  canvas.addEventListener('pointerdown',function(){ hint.style.display='none'; },{once:true});

  /* ============ keyboard ============ */
  function sendKnob(state){ send(Object.assign({t:'knob'},state)); }
  document.addEventListener('keydown',function(e){
    if(e.repeat) return;
    var handled=true;
    switch(e.key){
      case 'ArrowUp': sendKnob({y:-1}); break;
      case 'ArrowDown': sendKnob({y:1}); break;
      case 'ArrowLeft': sendKnob({x:-1}); break;
      case 'ArrowRight': sendKnob({x:1}); break;
      case 'Enter': sendKnob({select:true}); break;
      case 'Escape': case 'Backspace': sendKnob({back:true}); break;
      case 'h': case 'H': sendKnob({home:true}); break;
      case 's': case 'S': sendKnob({siri:true}); break;
      case ' ': sendKnob({playpause:true}); break;
      default: handled=false;
    }
    if(handled) e.preventDefault();
  });

  /* ============ safe area margins (WheelPlay-style) ============ */
  var margins={top:0,bottom:0,left:0,right:0};
  function applyMargins(){
    var mt=margins.top+'vh', mb=margins.bottom+'vh',
        ml=margins.left+'vw', mr=margins.right+'vw';
    [img,canvas].forEach(function(el){
      el.style.top=mt; el.style.bottom=mb;
      el.style.left=ml; el.style.right=mr;
      el.style.width='calc(100vw - '+ml+' - '+mr+')';
      el.style.height='calc(100vh - '+mt+' - '+mb+')';
    });
  }
  ['top','bottom','left','right'].forEach(function(k){
    var el=document.getElementById('margin-'+k), v=document.getElementById('margin-'+k+'-v');
    el.addEventListener('input',function(){
      margins[k]=+el.value; v.textContent=el.value+'%'; applyMargins();
      try{ localStorage.setItem('macplay-margin-'+k, el.value); }catch(e){}
    });
    try{ var sv=localStorage.getItem('macplay-margin-'+k); if(sv!==null){ el.value=sv; v.textContent=sv+'%'; margins[k]=+sv; } }catch(e){}
  });
  applyMargins();

  /* ============ focus mode ============ */
  focusbtn.addEventListener('click',function(e){
    e.stopPropagation();
    document.body.classList.toggle('focus');
    focusbtn.textContent=document.body.classList.contains('focus')?'⛶':'⛶';
  });

  /* ============ settings panel ============ */
  panelbtn.addEventListener('click',function(e){
    e.stopPropagation();
    panel.style.display=panel.style.display==='block'?'none':'block';
  });
  document.getElementById('applydisplay').addEventListener('click',function(){
    var res=document.getElementById('res').value.split('x');
    send({t:'display', width:+res[0], height:+res[1],
      fps:+document.getElementById('fps').value,
      codec:document.getElementById('codec').value,
      uiscale:+document.getElementById('uiscale').value});
    alert('显示设置已发送，CarPlay 会话将重启以新参数重新协商');
  });
  document.getElementById('matchwin').addEventListener('click',function(){
    var dpr=window.devicePixelRatio||1;
    var w=Math.round(window.innerWidth*dpr), h=Math.round(window.innerHeight*dpr);
    send({t:'display', width:w, height:h, matchWindow:true});
    alert('已按本窗口物理像素 ('+w+'×'+h+') 请求重连');
  });

  /* ============ auto fit: report window pixels to the Mac ============ */
  // Send the browser window's physical pixel size whenever it changes so the
  // CarPlay stream is renegotiated at the native resolution of the display
  // (head unit) showing it. Debounced: each change restarts the session.
  var fitTimer=null, lastFit='';
  function sendFit(){
    var dpr=window.devicePixelRatio||1;
    var w=Math.round(window.innerWidth*dpr), h=Math.round(window.innerHeight*dpr);
    if(w<320||h<240) return;
    var key=w+'x'+h+'@'+dpr;
    if(key===lastFit) return;
    lastFit=key;
    send({t:'display', width:w, height:h, matchWindow:true});
  }
  function scheduleFit(){
    if(fitTimer) clearTimeout(fitTimer);
    fitTimer=setTimeout(sendFit,1200);
  }
  window.addEventListener('resize',scheduleFit);
  window.addEventListener('orientationchange',scheduleFit);
  // First report once the control channel is up; then keep tracking.
  var origConnect=connect;
  connect=function(){
    origConnect();
    var oldOnopen=ws.onopen;
    ws.onopen=function(){
      if(oldOnopen) oldOnopen();
      setTimeout(sendFit,300);
    };
  };
  connect();
})();
</script>
</body>
</html>
